<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320, height=180">
  <title>Bundled GSAP resource check</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    html, body, #scene { margin: 0; width: 320px; height: 180px; overflow: hidden; background: #10151a; }
    #scene { position: relative; }
    #marker { position: absolute; left: 16px; top: 24px; }
    #dot { display: block; width: 32px; height: 32px; background: white; }
  </style>
</head>
<body>
  <div id="scene" data-composition-id="scene" data-width="320" data-height="180" data-duration="1" data-fps="30">
    <div id="marker" class="clip" data-start="0" data-duration="1" data-track-index="0"><span id="dot"></span></div>
  </div>
  <script>
    if (typeof gsap === "undefined" || gsap.version !== "3.15.0") throw new Error("Bundled GSAP 3.15.0 missing");
    const tl = gsap.timeline({ paused: true });
    tl.to("#dot", { x: 200, duration: 1, ease: "none" }, 0);
    window.__timelines = window.__timelines || {};
    window.__timelines["scene"] = tl;
  </script>
</body>
</html>
