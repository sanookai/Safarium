<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}#box{position:absolute;left:0;top:200px;width:100px;height:100px;background:#e00}</style></head><body><div id="stage" style="position:absolute;left:0;top:0;width:800px;height:600px"></div><script src="../probe-libs/lottie.min.js"></script><script>
// fetch of lottie.json is blocked on file://, so the same JSON is embedded as lottie-data.js
</script><script src="lottie-data.js"></script><script>
const anim = lottie.loadAnimation({container:document.getElementById('stage'),renderer:'svg',loop:false,autoplay:false,animationData:window.LOTTIE_DATA});
window.__seek = t => { anim.goToAndStop(t*1000, false); };
// lottie's loader uses setTimeout(0): under the VirtualClock it only runs on the first seek, so DOMLoaded can't gate readiness
window.__ready = true;
</script></body></html>
