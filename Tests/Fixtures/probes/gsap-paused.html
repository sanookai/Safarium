<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#fff;overflow:hidden}#box{position:absolute;left:0;top:200px;width:100px;height:100px;background:#e00}</style></head><body><div id="box"></div><script src="../probe-libs/gsap.min.js"></script><script>
const tl = gsap.timeline({paused:true});
